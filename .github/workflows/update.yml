name: Mise à jour prévisions Gard rhodanien

on:

  workflow_dispatch: {}   # permet de le lancer manuellement depuis GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests

      - name: Lancer le pipeline
        env:
          INFOCLIMAT_API_KEY: ${{ secrets.INFOCLIMAT_API_KEY }}
        run: python scripts/update_forecast.py

      - name: Committer les données mises à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Mise à jour prévisions $(date -u +%F)"
          git push
